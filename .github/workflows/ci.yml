name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  db-tests:
    name: Migraciones y pruebas de base de datos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones y ejecutar pruebas
        env:
          # Base desechable del servicio de CI. Nunca apunta a Supabase.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: ./scripts/test-db.sh
