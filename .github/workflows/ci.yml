name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  db-tests:
    name: Migraciones y pruebas de base de datos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones y ejecutar pruebas
        env:
          # Base desechable del servicio de CI. Nunca apunta a Supabase.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: ./scripts/test-db.sh

  dashboard:
    name: Dashboard (tipos, pruebas y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Compilar (sin claves, la app muestra "sin configurar")
        run: npm run build

  mcp:
    name: Conector MCP (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/mcp/deno.json supabase/functions/mcp/index.ts
